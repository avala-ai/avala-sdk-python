[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avala"
version = "0.10.0"
description = "Official Python SDK for the Avala API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24,<1", "pydantic>=2.0,<3"]

[project.urls]
Homepage = "https://avala.ai"
Documentation = "https://avala.ai/docs"
Repository = "https://github.com/avala-ai/avala-sdk-python"

[project.optional-dependencies]
dev = ["pytest>=7", "respx>=0.20", "mypy>=1", "ruff>=0.1", "pytest-asyncio>=0.21", "boto3>=1.26"]
cli = ["click>=8.0", "rich>=13.0", "tqdm>=4.60"]
# PyTorch data loading (avala.torch) — stream annotated frames into training, no export step.
torch = ["torch>=2.0", "pillow>=9.0"]
# LeRobot integration: Avala -> LeRobot export (avala.lerobot) and
# LeRobot -> Avala MCAP import (avala.importers.lerobot, writes
# foxglove.CompressedImage + Struct MCAP per episode).
# NOTE: lerobot requires Python 3.12+; this extra is unusable on 3.9-3.11.
lerobot = [
    "lerobot>=0.5,<0.6",
    "mcap>=1.1",
    "mcap-protobuf-support>=0.5",
    "foxglove-schemas-protobuf>=0.3",
    "numpy>=2.0",
    "pillow>=9.0",
]
# Torch-free LeRobot v3 reader/writer (avala.converters.lerobot_v3) and the LeRobot <-> MCAP
# bridge. No torch, no lerobot library: usable on the server and on Python 3.9+. Image
# features and the MCAP bridge need pillow + the mcap packages, included here; the ROS
# decoders let MCAP -> LeRobot read ros2msg/ros1msg sensor_msgs/JointState.
lerobot-core = [
    "pyarrow>=14",
    "numpy>=1.23",
    "pillow>=9.0",
    "mcap>=1.1",
    "mcap-protobuf-support>=0.5",
    "foxglove-schemas-protobuf>=0.3",
    "mcap-ros2-support>=0.5",
    "mcap-ros1-support>=0.7",
]
# lerobot-core plus PyAV for LeRobot `video` features (mp4 encode/decode).
lerobot-core-video = [
    "pyarrow>=14",
    "numpy>=1.23",
    "pillow>=9.0",
    "mcap>=1.1",
    "mcap-protobuf-support>=0.5",
    "foxglove-schemas-protobuf>=0.3",
    "mcap-ros2-support>=0.5",
    "mcap-ros1-support>=0.7",
    "av>=12",
]
# ROS bag -> Avala MCAP import (avala.importers.rosbag). Reads ROS1 .bag / ROS2 .db3
# with the pure-Python rosbags lib (no ROS install) and re-encodes camera topics to
# foxglove.CompressedImage MCAP.
rosbag = [
    "rosbags>=0.9",
    "mcap>=1.1",
    "mcap-protobuf-support>=0.5",
    "foxglove-schemas-protobuf>=0.3",
    "numpy>=1.23",
    "pillow>=9.0",
]

# Inspect Robots eval logs -> outcome-labelled sequences (avala.importers.inspect_robots).
# inspect-robots reads/validates the JSON eval log; the MCAP packages convert recorded
# trial actions/frames for `--create`. inspect-robots itself does not depend on
# inspect-ai, so neither does this extra.
# NOTE: inspect-robots requires Python 3.10+; this extra is unusable on 3.9.
inspect = [
    "inspect-robots>=0.60,<1; python_version >= '3.10'",
    "mcap>=1.1",
    "mcap-protobuf-support>=0.5",
    "foxglove-schemas-protobuf>=0.3",
    "numpy>=1.24",
    "pillow>=9.0",
]

[project.scripts]
avala = "avala.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff 0.16 expanded its implicit defaults from the historical Pyflakes +
# pycodestyle correctness set to hundreds of additional rules. Keep this SDK's
# established CI contract explicit so dependency resolution cannot change the
# lint baseline underneath an unrelated PR.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true
# avala/torch, avala/lerobot, and the lerobot/rosbag importers integrate untyped,
# conditionally-installed third-party stacks (torch / lerobot / rosbags / mcap+foxglove
# protobuf); strict typing there isn't productive and they're not base/CI deps. (cli/ too.)
exclude = [
    "avala/cli/",
    "avala/torch/",
    "avala/lerobot/",
    "avala/importers/lerobot\\.py",
    "avala/importers/rosbag\\.py",
]

# importers/__init__ imports these adapters eagerly to register them; skip following so
# strict checking of the rest of avala/importers/ doesn't pull in the excluded modules.
[[tool.mypy.overrides]]
module = ["avala.importers.lerobot", "avala.importers.rosbag"]
follow_imports = "skip"
ignore_missing_imports = true

# avala.converters is strictly typed, but its runtime deps are optional and mostly
# untyped (pyarrow, PyAV, mcap); keep CI (which installs only [dev,cli]) green.
[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "av",
    "av.*",
    "numpy",
    "numpy.*",
    "PIL",
    "PIL.*",
    "mcap",
    "mcap.*",
    "mcap_protobuf",
    "mcap_protobuf.*",
    "mcap_ros2",
    "mcap_ros2.*",
    "mcap_ros1",
    "mcap_ros1.*",
    "foxglove_schemas_protobuf",
    "foxglove_schemas_protobuf.*",
    "google.protobuf",
    "google.protobuf.*",
]
ignore_missing_imports = true
